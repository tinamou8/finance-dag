[project]
name = "finance-dag"
version = "0.1.0.dev6"
description = "Directed Acyclic Graph (DAG) management specifically for financial data workflows."
authors = [
    { name = "José A. del Val", email = "delval@duck.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE*"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-cov>=7.1.0"]
lint = ["ruff>=0.15.10"]
type = ["mypy>=1.20.1"]

[project.urls]
repository = "https://github.com/tinamou8/finance-dag"
documentation = "https://finance-dag.readthedocs.io"
issues = "https://github.com/tinamou8/finance-dag/issues"
changelog = "https://github.com/tinamou8/finance-dag/blob/main/CHANGELOG.md"

[tool.mypy]
python_version = "3.12"
show_column_numbers = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
# more or less the same config that Hatch uses
extend-select = ["A", "ARG", "B", "BLE", "C4", "COM818", "DTZ", "E1", "EM", "FBT", "FLY", "FURB", "G", "I", "ICN", "INP",
    "INT", "ISC003", "LOG", "N", "PERF", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PYI", "RET", "RUF", "RSE", "S",
    "SIM", "SLF001", "T10", "T20", "TD", "TID", "TRY", "UP", "W"]
extend-ignore = ["B027", "B903", "B911", "E111", "E114", "E117", "FBT003", "FURB101", "FURB103", "FURB140", "PERF203",
    "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0916", "PLR0917", "PLR1702", "RET501",
    "RET502", "RUF200", "SIM401", "TD001", "TD002", "TD003", "W191"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*" = ["PLC1901", "PLR2004", "PLR6301", "S", "TID252"]
"fdag/examples.py" = ["T201", "SLF001", "RET504"]
"fdag/benchmark_dag.py" = ["T201", "PLW0108", "BLE001", "S102"]
"**/*.pyi" = ["PYI044", "PYI021"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.tox]
requires = ["tox>=4"]
skip_missing_interpreters = false
env_list = ["lint", "type", "py312", "py313", "py314"]

[tool.tox.env_run_base]
description = "Run test suite with pytest"
runner = "uv-venv-lock-runner"
extras = ["test"]
commands = [["python", "-V"], ["pytest", "tests{/}", "--import-mode", "importlib"]]

[tool.tox.env.py312]
commands = [["python", "-V"], ["pytest", "tests{/}", "--import-mode", "importlib", "--cov=fdag", "--cov-report=term-missing"]]

[tool.tox.env.lint]
description = "Run linting on code base"
extras = ["lint"]
commands = [["ruff", "check", "--select", "I", "--fix"], ["ruff", "format", "fdag"], ["ruff", "check", "fdag"]]

[tool.tox.env.type]
description = "Run type check on code base"
extras = ["type"]
commands = [["mypy", "fdag"]]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["fdag"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling", "hatch-cython", "Cython"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "Cython>=3.2.4",
    "mkdocs-materialx>=10.1.3",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocstrings-python>=2.0.3",
    "prek>=0.3.10",
    "properdocs>=1.6.7",
    "setuptools>=82.0.1",
]

[tool.hatch.build.targets.sdist]
include = [
    "/fdag",
]
exclude = [
    "/wheelhouse",
]

[tool.hatch.build.targets.wheel]
packages = ["fdag"]
exclude = ["wheelhouse", "build"]

[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
directives = { language_level = 3 }
src = "fdag"
compile_py = false
includes = ["."]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "pp* *musllinux*"
test-requires = "pytest"
test-command = "pytest {project}/tests"
build-verbosity = 1
build-dir = "build/cibw"

[tool.setuptools.packages.find]
include = ["fdag*"]
