version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      - uv sync --all-extras
    build:
      html:
        - uv run properdocs build --clean --site-dir $READTHEDOCS_OUTPUT/html --config-file properdocs.yml
