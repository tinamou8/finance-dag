exclude = '^(\.idea/|\.vscode/|\.gemini/|\.junie/|\.python-version|\.tox/|build/|dist/)'

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks"
rev = "v1.5.6"

[[repos.hooks]]
id = "insert-license"
files = '^(fdag/|tests/).*\.(py|pyx|pyi)$'
exclude = '(?i)__init__\.py$'
args = [
    "--license-filepath", "HEADER.txt",
    "--comment-style", "#",
]
